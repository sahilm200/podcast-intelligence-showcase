[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-podcast-processor"
version = "0.1.0"
description = "Automated podcast ingestion, transcription, and digest generation"
authors = [{name = "P3 Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # CLI / shared
    "click>=8.1.0",
    "duckdb>=0.9.0",
    "feedparser>=6.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    # Web service (API)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "supabase>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "authlib>=1.3.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "arq>=0.25.0",
    "redis>=5.0.0",
    "spotipy>=2.23.0",
    "cryptography>=41.0.0",
    "slowapi>=0.1.9",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "bleach>=6.0.0",
    "boto3>=1.28.0",
]

[project.optional-dependencies]
# Heavy ML deps — only needed for local CLI transcription, not the API server
local = [
    "openai-whisper>=20231117",
    "faster-whisper>=1.0.0",
    "ollama>=0.3.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
macos = [
    "parakeet-mlx>=0.1.0",
]

[project.scripts]
p3 = "p3.cli:main"
p3-api = "p3.api.main:start_server"
p3-worker = "p3.api.worker:start_worker"

[tool.setuptools.packages.find]
where = ["."]
include = ["p3*"]
exclude = ["podcast-worker*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

